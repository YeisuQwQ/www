<html lang="zh-CN">

    <style>
        :root {
            --bg-deep: #0b0f14;
            --card-bg: rgba(16, 22, 30, 0.66);
            --card-bg-hover: rgba(20, 28, 38, 0.8);
            --hairline: rgba(255, 255, 255, 0.08);
            --hairline-strong: rgba(255, 255, 255, 0.16);
            --text: #e8ecf4;
            --text-dim: #9aa7b8;
            --text-faint: #6b7787;
            --green: #3fb950;
            --green-deep: #2ea44f;
            --green-tint: rgba(63, 185, 80, 0.12);
            --green-border: rgba(63, 185, 80, 0.45);
            --green-glow: rgba(63, 185, 80, 0.18);
            --blue-tint: rgba(56, 139, 253, 0.10);
            --radius: 20px;
            --radius-sm: 14px;
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.28);
            --shadow-hover: 0 12px 32px rgba(0, 0, 0, 0.45);
        }
        * {
            box-sizing: border-box;
        }
        html {
            -webkit-text-size-adjust: 100%;
        }
        body {
            margin: 0;
            padding-bottom: 90px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text);
            background-color: var(--bg-deep);
        }
        /* 背景层：背景图 + 暗色遮罩（保证文字可读性） */
        body::before {
            content: ' ';
            position: fixed;
            z-index: -2;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            background:
                linear-gradient(180deg, rgba(9, 12, 17, 0.55) 0%, rgba(9, 12, 17, 0.82) 100%),
                url(/images/bg.PNG) center 0 no-repeat;
            background-size: cover;
        }
        /* 背景层：静态氛围光斑（无动画） */
        body::after {
            content: ' ';
            position: fixed;
            z-index: -1;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            background:
                radial-gradient(ellipse 55% 40% at 85% -5%, rgba(63, 185, 80, 0.09), transparent 60%),
                radial-gradient(ellipse 45% 35% at 8% 108%, rgba(102, 126, 234, 0.08), transparent 60%);
            pointer-events: none;
        }
        ::selection {
            background: rgba(63, 185, 80, 0.3);
        }
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.14);
            border-radius: 5px;
            border: 2px solid var(--bg-deep);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.24);
        }
        a:focus-visible,
        button:focus-visible {
            outline: 2px solid var(--green-border);
            outline-offset: 2px;
        }
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 54px;
            z-index: 1000;
            background: rgba(10, 13, 18, 0.55);
            -webkit-backdrop-filter: blur(20px) saturate(1.3);
            backdrop-filter: blur(20px) saturate(1.3);
            border-bottom: 1px solid var(--hairline);
        }
        .nav {
            text-align: center;
        }
        .nav a,
        .nav .nav-disabled {
            display: inline-block;
            padding: 16px 30px;
            text-decoration: none;
            color: var(--text);
            font-size: 15px;
            letter-spacing: 2px;
            transition: color 0.25s ease;
        }
        .nav .nav-disabled {
            color: var(--text-faint);
            cursor: default;
        }
        .profile {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 130px 0 40px;
        }
        .avatar {
            width: 106px;
            height: 106px;
            padding: 3px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3fb950, #1f6feb 65%, #764ba2);
            box-shadow: 0 0 24px rgba(63, 185, 80, 0.22);
            margin-bottom: 20px;
        }
        .avatar img {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }
        .profile h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: 3px;
        }
        .profile a {
            color: var(--text);
            text-decoration: none;
            transition: color 0.25s ease, text-shadow 0.25s ease;
        }
        .green-button {
            display: flex;
            justify-content: center;
            margin: 26px 0 36px;
        }
        .green-button a {
            display: inline-block;
            padding: 11px 34px;
            background: linear-gradient(135deg, var(--green) 0%, var(--green-deep) 100%);
            color: #fff;
            font-size: 15px;
            letter-spacing: 2px;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 4px 14px rgba(46, 164, 79, 0.3);
            transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
        }
        .contact {
            width: calc(100% - 40px);
            max-width: 460px;
            min-height: 190px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            padding: 26px 30px;
            border: 1px solid var(--hairline);
            border-radius: var(--radius);
            text-align: center;
            color: var(--text-dim);
            background: var(--card-bg);
            -webkit-backdrop-filter: blur(18px);
            backdrop-filter: blur(18px);
            transform: translate3d(0, 0, 0);
            box-shadow: var(--shadow);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .contact p {
            margin: 0;
            font-size: 15px;
            line-height: 2;
            letter-spacing: 1px;
        }
        .options {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 40px;
            max-width: 1180px;
            margin-left: auto;
            margin-right: auto;
        }
        .option {
            width: 216px;
            min-height: 190px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 18px;
            padding: 18px;
            border: 1px solid var(--hairline);
            border-radius: var(--radius);
            background: var(--card-bg);
            -webkit-backdrop-filter: blur(18px);
            backdrop-filter: blur(18px);
            transform: translate3d(0, 0, 0);
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease, background 0.25s ease;
        }
        .option .description {
            max-width: 100%;
            text-align: center;
            color: var(--text-dim);
            font-size: 13px;
            line-height: 1.6;
            word-break: break-word;
        }
        .option a {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text);
            width: 100%;
        }
        .option-icon {
            width: 54px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--hairline);
            transition: background 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
        }
        .option img {
            width: 26px;
            height: 26px;
            object-fit: contain;
        }
        .option:hover .option-icon {
            background: var(--green-tint);
            border-color: var(--green-border);
            transform: scale(1.06);
        }
        .footer {
            -webkit-backdrop-filter: blur(20px) saturate(1.3);
            backdrop-filter: blur(20px) saturate(1.3);
            background: rgba(10, 13, 18, 0.55);
            color: var(--text-faint);
            text-align: center;
            padding: 14px 0 calc(14px + env(safe-area-inset-bottom));
            width: 100%;
            position: fixed;
            bottom: 0;
            left: 0;
            z-index: 1000;
            border-top: 1px solid var(--hairline);
            font-size: 13px;
            letter-spacing: 1px;
            font-variant-numeric: tabular-nums;
        }
        @media (max-width: 480px) {
            body {
                padding-bottom: calc(90px + env(safe-area-inset-bottom));
            }
            /* 手机竖屏：背景遮罩调浅，让照片可见 */
            body::before {
                background:
                    linear-gradient(180deg, rgba(9, 12, 17, 0.42) 0%, rgba(9, 12, 17, 0.7) 100%),
                    url(/images/bg.PNG) center 0 no-repeat;
                background-size: cover;
            }
            .nav a,
            .nav .nav-disabled {
                padding: 16px 16px;
                font-size: 14px;
            }
            .profile {
                margin: 100px 0 30px;
            }
            .avatar {
                width: 92px;
                height: 92px;
                margin-bottom: 16px;
            }
            .profile h1 {
                font-size: 22px;
                letter-spacing: 2px;
            }
            .green-button {
                margin: 20px 0 28px;
            }
            .green-button a {
                padding: 10px 28px;
                font-size: 14px;
            }
            .contact {
                min-height: 170px;
                padding: 22px 24px;
            }
            .contact p {
                font-size: 14px;
            }
            .options {
                margin-top: 28px;
                padding: 0 8px;
            }
            .option {
                width: calc((100vw - 40px) / 2);
                min-height: 168px;
                margin: 8px;
                padding: 14px 10px;
            }
            .option-icon {
                width: 46px;
                height: 46px;
                margin-bottom: 10px;
            }
            .option img {
                width: 22px;
                height: 22px;
            }
            .option .description {
                font-size: 13px;
                line-height: 1.55;
            }
        }
        @media (max-width: 340px) {
            .option {
                width: calc(100vw - 32px);
                margin: 8px auto;
            }
        }
        @media (hover: hover) {
            .nav a:hover {
                color: var(--green);
            }
            .profile a:hover {
                color: var(--green);
                text-shadow: 0 0 18px var(--green-glow);
            }
            .green-button a:hover {
                transform: translateY(-2px);
                filter: brightness(1.08);
                box-shadow: 0 8px 22px rgba(63, 185, 80, 0.4);
            }
            .contact:hover {
                transform: translateY(-3px);
                box-shadow: var(--shadow-hover);
            }
            .option:hover {
                background: var(--card-bg-hover);
                border-color: var(--green-border);
                transform: translateY(-6px);
                box-shadow: var(--shadow-hover), 0 0 26px var(--green-glow);
            }
        }
        @media (hover: none) {
            .option:active {
                background: var(--card-bg-hover);
                border-color: var(--green-border);
                transform: scale(0.97);
            }
            .option:active .option-icon {
                background: var(--green-tint);
                border-color: var(--green-border);
            }
            .green-button a:active {
                transform: scale(0.97);
            }
        }
    </style>
</head>

    <script>
        (function () {
            var start = new Date("2024/08/29 02:28:00");
            var span = document.getElementById("runtime_span");
            if (!span) {
                return;
            }
            function tick() {
                var diff = Date.now() - start.getTime();
                var days = Math.floor(diff / 86400000);
                var hours = Math.floor(diff % 86400000 / 3600000);
                var minutes = Math.floor(diff % 3600000 / 60000);
                var seconds = Math.floor(diff % 60000 / 1000);
                span.textContent = "本站已运行 " + days + "天" + hours + "小时" + minutes + "分" + seconds + "秒";
            }
            tick();
            setInterval(tick, 1000);
        })();
    </script>
